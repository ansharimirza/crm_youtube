server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2G;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (filename changes every build) — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html points at the current hashed bundle — must always be revalidated,
    # else the browser keeps loading the old bundle after a deploy.
    location = /index.html     { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # PWA control files must never be stale, else updates never reach the phone
    location = /sw.js          { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js  { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~ ^/(api|auth) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Stream large uploads straight to the API instead of buffering the whole
        # file to a temp file on disk (avoids disk-full failures on 1GB+ uploads).
        proxy_request_buffering off;
    }
}
